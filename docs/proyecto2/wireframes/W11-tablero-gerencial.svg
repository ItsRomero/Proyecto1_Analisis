<text x='20' y='844' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#222'><tspan font-weight='bold'>1.</tspan> Fecha de corte y estado del cierre en la primera línea: el contexto antes que la cifra.</text>
<text x='20' y='860' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#222'><tspan font-weight='bold'>2.</tspan> Riesgo primero y con borde grueso: es el indicador de decisión del comité.</text>
<text x='20' y='876' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#222'><tspan font-weight='bold'>3.</tspan> Incobrables junto al riesgo: una baja reduce el % sin cobrar (7.00 → 6.06 %).</text>
<text x='20' y='892' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#222'><tspan font-weight='bold'>4.</tspan> Mora con borde discontinuo, otro símbolo y definición distinta: nunca el mismo rótulo.</text>
<text x='20' y='908' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#222'><tspan font-weight='bold'>5.</tspan> Desglose del núcleo (calcularCarteraPorTramo): 3.00+2.25+1.00+0.75 = 7.00 %. La UI no recalcula.</text>
<text x='20' y='924' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#222'><tspan font-weight='bold'>6.</tspan> Actividad del período abajo: se consulta después de entender el riesgo.</text>
<text x='20' y='940' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#222'><tspan font-weight='bold'>7.</tspan> Chat a la derecha: no tapa las cifras; cita la misma fuente (núcleo) que el tablero (6.3).</text>
