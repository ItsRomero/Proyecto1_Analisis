<text x='20' y='804' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#222'><tspan font-weight='bold'>1.</tspan> Un tramo por fila: rango en días, tasa anual y días</text>
<text x='34' y='820' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#222'>recorridos. Ancho de barra = días.</text>
<text x='20' y='836' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#222'><tspan font-weight='bold'>2.</tspan> Nota de redondeo: las filas suman Q50.81 si se</text>
<text x='34' y='852' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#222'>redondean por separado; el total oficial es Q50.80</text>
<text x='34' y='868' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#222'>(sección 7.3).</text>
