<text x='20' y='844' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'><tspan font-weight='bold'>1.</tspan> Tramo en lenguaje llano (&#x27;lleva 45 días de atraso&#x27;) y</text>
<text x='34' y='860' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'>aviso del siguiente tramo antes de que ocurra (MC-4).</text>
<text x='20' y='876' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'><tspan font-weight='bold'>2.</tspan> Cifra principal = lo exigible hoy según el núcleo (M-5:</text>
<text x='34' y='892' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'>Q25.00 + Q18.14 + Q278.86 + Q725.76). Caso de referencia</text>
<text x='34' y='908' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'>Q10,000 a 12 meses.</text>
<text x='20' y='924' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'><tspan font-weight='bold'>3.</tspan> Misma disposición que Figma. Datos de ejemplo: Figma usa</text>
<text x='34' y='940' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'>a Pedro Xol Cux (incobrable, 132 días); se recomienda un</text>
<text x='34' y='956' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'>crédito en Mora 2 para que las cifras coincidan con</text>
<text x='34' y='972' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'>M-2/M-5.</text>
