<text x='20' y='844' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'><tspan font-weight='bold'>1.</tspan> Búsqueda por nombre o municipio: se reconoce, no se</text>
<text x='34' y='860' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'>recuerda (Nielsen 6). Sustituye a la pantalla de</text>
<text x='34' y='876' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'>búsqueda separada.</text>
<text x='20' y='892' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'><tspan font-weight='bold'>2.</tspan> Etiqueta de tramo y días de atraso en cada tarjeta;</text>
<text x='34' y='908' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'>ordenar por prioridad pone primero a quien más urge</text>
<text x='34' y='924' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'>visitar.</text>
<text x='20' y='940' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'><tspan font-weight='bold'>3.</tspan> Botón + inicia una nueva solicitud (CU-02).</text>
