<text x="20" y="974" font-size="14" font-weight="700" fill="#1F2937">Notas de diseño</text>
<circle cx="31" cy="995" r="10" fill="#1F2937"/><text x="31" y="999" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="50" y="1000" font-size="13" fill="#1F2937">Lista de clientes (15 de 15) con búsqueda por nombre, DPI o código y filtros por tramo.</text>
<circle cx="31" cy="1021" r="10" fill="#1F2937"/><text x="31" y="1025" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="50" y="1026" font-size="13" fill="#1F2937">Cada fila: iniciales, nombre, código · zona, tramo en texto y saldo; la fila elegida queda resaltada.</text>
<circle cx="31" cy="1047" r="10" fill="#1F2937"/><text x="31" y="1051" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="50" y="1052" font-size="13" fill="#1F2937">Encabezado de la ficha: estado en lenguaje llano («Más de un mes de atraso»), como se decidió en E1/E2.</text>
<circle cx="31" cy="1073" r="10" fill="#1F2937"/><text x="31" y="1077" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="50" y="1078" font-size="13" fill="#1F2937">Datos de contacto: DPI, teléfono y zona. Sugerencia: enmascarar el DPI (2456 ••••• 0101) y mostrarlo al pedirlo.</text>
<circle cx="31" cy="1099" r="10" fill="#1F2937"/><text x="31" y="1103" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="50" y="1104" font-size="13" fill="#1F2937">Resumen: deuda total, créditos activos y estado general.</text>
<circle cx="31" cy="1125" r="10" fill="#1F2937"/><text x="31" y="1129" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="50" y="1130" font-size="13" fill="#1F2937">Créditos del cliente: saldo Q6,259.07 tras 5 de 12 cuotas de Q1,004.62, igual que el núcleo; «Ver» abre el detalle (CU-15).</text>
