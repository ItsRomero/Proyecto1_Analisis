</g>
<text x="20" y="874" font-size="14" font-weight="700" fill="#1F2937">Notas de diseño</text>
<circle cx="31" cy="895" r="10" fill="#1F2937"/><text x="31" y="899" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="50" y="900" font-size="13" fill="#1F2937">Barra del panel: Dashboard, Cartera, Clientes, Cobros y Reportes; la acción principal «Cierre diario» (CU-12) va aparte y destacada.</text>
<circle cx="31" cy="921" r="10" fill="#1F2937"/><text x="31" y="925" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="50" y="926" font-size="13" fill="#1F2937">Selector de período: todas las cifras corresponden a un corte (fecha del puerto Reloj / cierre congelado), no a «hoy».</text>
<circle cx="31" cy="947" r="10" fill="#1F2937"/><text x="31" y="951" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="50" y="952" font-size="13" fill="#1F2937">Cinco indicadores del período: cartera total, desembolsos, recuperaciones, cartera en riesgo (CeR) e incobrable.</text>
<circle cx="31" cy="973" r="10" fill="#1F2937"/><text x="31" y="977" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="50" y="978" font-size="13" fill="#1F2937">Cartera por tramo: barra apilada al 100 % + lista con monto y %; «Ver →» abre los créditos de ese tramo (Cartera filtrada, CU-14).</text>
<circle cx="31" cy="999" r="10" fill="#1F2937"/><text x="31" y="1003" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="50" y="1004" font-size="13" fill="#1F2937">Tendencia de 6 meses y eficiencia de cobro: 65.6 % = Q318,000 / Q485,000 (cifra verificada).</text>
<circle cx="31" cy="1025" r="10" fill="#1F2937"/><text x="31" y="1029" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="50" y="1030" font-size="13" fill="#1F2937">CeR 23.4 % = 8.3 + 6.1 + 5.8 + 3.2 (tramos de 1 a 120 días, sin incobrable); Q573,300 = 23.4 % × Q2,450,000 (verificado).</text>
<circle cx="31" cy="1051" r="10" fill="#1F2937"/><text x="31" y="1055" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="50" y="1056" font-size="13" fill="#1F2937">Espacio reservado para el asistente conversacional (sección 6.3 del enunciado).</text>
<circle cx="31" cy="1077" r="10" fill="#1F2937"/><text x="31" y="1081" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><text x="50" y="1082" font-size="13" fill="#B42318">DECIDIR: la guía G04 del E2 ponía la cartera en riesgo primero; el prototipo pone la cartera total primero. Alinear ambos.</text>
<circle cx="31" cy="1103" r="10" fill="#1F2937"/><text x="31" y="1107" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text><text x="50" y="1108" font-size="13" fill="#B42318">CORREGIR EN FIGMA: el período y el pie dicen 2024; el proyecto usa septiembre de 2026.</text>
<circle cx="31" cy="1129" r="10" fill="#1F2937"/><text x="31" y="1133" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text><text x="50" y="1134" font-size="13" fill="#1F2937">Distinguir «Incobrable del período» (Q18,500, lo castigado este mes) de «Incobrable» en tramos (Q58,800, saldo acumulado).</text>
</svg>