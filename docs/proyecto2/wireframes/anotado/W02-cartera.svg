<circle cx="31" cy="1153" r="10" fill="#1F2937"/><text x="31" y="1157" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="50" y="1158" font-size="13" fill="#1F2937">Estado con pastilla, punto y texto del tramo: no depende solo del color (WCAG 1.4.1).</text>
