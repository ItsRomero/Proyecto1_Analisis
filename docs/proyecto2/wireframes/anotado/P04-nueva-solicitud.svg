<text x='20' y='1084' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'><tspan font-weight='bold'>1.</tspan> El cliente se elige de la lista, no se teclea: no se</text>
<text x='34' y='1100' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'>vuelve a pedir un dato ya capturado (WCAG 3.3.7).</text>
<text x='20' y='1116' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'><tspan font-weight='bold'>2.</tspan> Monto con − / + y montos rápidos; el rango se ve</text>
<text x='34' y='1132' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'>siempre. Evita teclear Q100,000 cuando el máximo es</text>
<text x='34' y='1148' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'>Q25,000 (MC-1, Nielsen 5).</text>
<text x='20' y='1164' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'><tspan font-weight='bold'>3.</tspan> Plazo con botones (3 a 24 meses), sin teclado.</text>
<text x='20' y='1180' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'><tspan font-weight='bold'>4.</tspan> Cuota calculada por el núcleo (plan-amortizacion.ts):</text>
<text x='34' y='1196' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'>Q5,000 × 12 meses = Q502.31, la mitad exacta del caso de</text>
<text x='34' y='1212' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#222'>referencia.</text>
